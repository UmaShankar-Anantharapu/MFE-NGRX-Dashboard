<div id="configure" class="tab-pane active">
    <!-- Search Bar -->
    <div class="search-container">
        <input type="text" id="chartSearch" placeholder="Search charts..." />
    </div>

    <!-- Charts List -->
    <div class="chart-list" cdkDropList [cdkDropListData]="chartsList" id="sourceList"
        [cdkDropListConnectedTo]="['targetList']">
        @for(chart of chartsList;track chart.id){
            <div class="chart-item" cdkDrag [cdkDragData]="chart" (cdkDragStarted)="onDragStart($event)"
            (cdkDragEnded)="onDragEnd($event)">
                {{ chart.title }}
    
                <ng-template cdkDragPreview>
                    <div class="drag-preview">
                        <strong>Dragging: {{ chart.title }}</strong>
                    </div>
                </ng-template>
            </div>
        }
    </div>

    <!-- Pagination -->
    <div class="pagination">
        <button class="page-button">Previous</button>
        <span class="page-number">1</span>
        <button class="page-button">Next</button>
    </div>
</div>
