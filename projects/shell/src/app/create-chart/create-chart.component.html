<div class="container">
    <div class="left-panel">
        <ng-container #chartContainer></ng-container>
    </div>
    <div class="right-panel">
        <div class="buttons">
            <button mat-flat-button class="custom-button" color="primary" (click)="onLoadChart()">load</button>
            <button mat-flat-button class="custom-button" color="primary" (click)="onSaveChart()">save</button>
        </div>
        <div class="tabs">
            <mat-tab-group>
                <mat-tab label="Configure">
                    <ng-container #configContainer></ng-container>
                </mat-tab>
                <mat-tab label="Design">
                    <ng-container #designContainer></ng-container>
                </mat-tab>
            </mat-tab-group>
        </div>
    </div>
</div>
