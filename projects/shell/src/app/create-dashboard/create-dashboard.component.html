<div class="container">
    <mat-toolbar class="header" color="accent">
        <!-- <input [(ngModel)]="dashboardName" matInput class="input-dname" matInputColor="accent"> -->
        <input [(ngModel)]="dashboardName" matInput class="input-dname" placeholder="Enter dashboard name" style="border: 2px solid transparent; outline: none;" [ngStyle]="{'border-color': focused ? 'var(--primary-main)' : 'transparent'}" (focus)="focused = true" (blur)="focused = false">
        <!-- <div class="buttons-group">
        <button class="save-btn" mat-button color="accent">Load</button>
        <button class="save-btn" mat-button (click)="saveDashboard()" color="primary">{{isExistingDashboard ? 'update' : 'save'}}</button>
        </div> -->
        <div class="buttons-group">
            <button mat-raised-button color="primary">Load</button>
            <button mat-raised-button color="primary" (click)="saveDashboard()">
              {{ isExistingDashboard ? 'Update' : 'Save' }}
            </button>
          </div>
        
    </mat-toolbar>
    <div class="left-panel">
        <ng-container #gridContainer></ng-container>
    </div>
    <div class="right-panel">
        <mat-tab-group>
            <mat-tab aria-label="Configure">
                <ng-template mat-tab-label>
                    <span class="tab-label">
                        Configure
                    </span>
                </ng-template>
                    <ng-container #configContainer></ng-container>
            </mat-tab>
            <mat-tab aria-label="Design">
                <ng-template mat-tab-label>
                    <span class="tab-label">
                        Design
                    </span>
                </ng-template>
                    <ng-container #designContainer></ng-container>
            </mat-tab>
        </mat-tab-group>
    </div>
</div>
