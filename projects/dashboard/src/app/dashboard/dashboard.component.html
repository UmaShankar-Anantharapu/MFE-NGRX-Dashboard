<div class="main-content" cdkDropList #targetList="cdkDropList" id="targetList"
    [cdkDropListConnectedTo]="['sourceList']" (cdkDropListDropped)="onDrop($event)" (mouseenter)="mouse('enter')"
    (mouseleave)="mouse('leave')">
    <!-- This is left empty for now -->
    <gridster [options]="options" *ngIf="dashboard.length>0">
        <!-- @for (item of dashboard;) { -->
        <gridster-item [item]="item" *ngFor="let item of dashboard;trackBy :trackById">
            <div class="chart-container" style="width: 100%; height: 100%;">
                <!-- <highcharts-chart *ngIf="this.highChartsOptionsMap[item['id']]" [Highcharts]="Highcharts"
                [options]="this.highChartsOptionsMap[item['id']]"
                style="width: 100%; height: 100%; display: block;">
            </highcharts-chart> -->
                <app-highcharts [chartOptions]="highChartsOptionsMap[item['id']]"
                    [isChartLoaded]="true" [showRemoveOption]="true" [chartId]="item['id']"></app-highcharts>
            </div>
        </gridster-item>
        <!-- } -->
    </gridster>
</div>
